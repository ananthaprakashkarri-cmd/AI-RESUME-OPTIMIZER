<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login | AI Resume Optimizer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#eef2ff,#dbeafe);

}

.login-box{

background:white;

width:420px;

padding:40px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.15);

}

.login-box h2{

text-align:center;

margin-bottom:10px;

}

.login-box p{

text-align:center;

color:#64748b;

margin-bottom:25px;

}

input{

width:100%;

padding:15px;

margin-top:15px;

border:1px solid #cbd5e1;

border-radius:10px;

font-size:15px;

}

button{

width:100%;

padding:15px;

margin-top:25px;

border:none;

background:#2563eb;

color:white;

font-size:17px;

border-radius:10px;

cursor:pointer;

}

button:hover{

background:#1d4ed8;

}

.bottom{

text-align:center;

margin-top:20px;

}

.bottom a{

text-decoration:none;

color:#2563eb;

font-weight:600;

}

</style>

</head>

<body>

<div class="login-box">

<h2>

Welcome Back 👋

</h2>

<p>

Login to continue

</p>

<input

type="email"

id="email"

placeholder="Email Address">

<input

type="password"

id="password"

placeholder="Password">

<button

onclick="signIn()">

Login

</button>

<div class="bottom">

Don't have an account?

<a href="signin.html">

Create Account

</a>

</div>

</div>

    <script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyBb16xq-5Qgn1UGcMq5oX5TAquGjyL1ewM",

authDomain: "ai-resume-optimizer-5ee82.firebaseapp.com",

projectId: "ai-resume-optimizer-5ee82",

storageBucket: "ai-resume-optimizer-5ee82.firebasestorage.app",

messagingSenderId: "244561832642",

appId: "1:244561832642:web:c5d4fc81d9e282b792295b"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

function signIn(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

if(!email || !password){

alert("Please enter your email and password.");

return;

}

signInWithEmailAndPassword(auth,email,password)

.then(()=>{

alert("Login Successful!");

window.location.href="index.html";

})

.catch((error)=>{

alert(error.message);

});

}

window.signIn = signIn;

</script>

</script>

</body>

</html>
